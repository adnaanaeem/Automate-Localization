<!--
  Generates the Review-screen README screenshot (shows the search filter in
  use). See the comment in demo_setup.html -- same caveat about drifting
  out of sync with index.html applies here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Automate Localization</title>
<link rel="stylesheet" href="../app/web/style.css" />
</head>
<body>
<header class="topbar">
  <h1>Automate Localization <span id="app-version" class="app-version">v1.1.6</span></h1>
  <nav class="steps">
    <span class="step done" data-step="setup">1. Setup</span>
    <span class="step active" data-step="review">2. Review</span>
    <span class="step" data-step="progress">3. Run</span>
    <span class="step" data-step="results">4. Results</span>
  </nav>
  <div class="menu-wrap">
    <button id="menu-btn" class="btn btn-small">☰ Menu</button>
    <div id="menu-dropdown" class="menu-dropdown hidden">
      <button id="menu-check-update" class="menu-item">Check for updates</button>
      <button id="menu-about" class="menu-item">About</button>
    </div>
  </div>
</header>

<div id="update-banner" class="update-banner hidden">
  <div id="update-banner-text"></div>
  <div class="update-banner-actions">
    <button id="update-install-btn" class="btn btn-primary btn-small">Download &amp; Install</button>
    <button id="update-dismiss-btn" class="btn btn-small">Not now</button>
  </div>
</div>

<main>
  <section id="screen-setup" class="screen"></section>

  <section id="screen-review" class="screen active">
    <div class="card summary-card"><div id="review-summary"></div></div>
    <div class="card">
      <input id="review-filter-input" type="text" placeholder="Filter by key or English text…" />
      <div id="review-filter-count" class="hint"></div>
      <div class="review-toolbar">
        <div>
          <button id="select-all-btn" class="btn btn-small">Select all</button>
          <button id="select-none-btn" class="btn btn-small">Select none</button>
        </div>
        <div id="selected-count" class="hint"></div>
      </div>
      <div class="table-wrap">
        <table id="review-table">
          <thead><tr><th class="col-check"></th><th>Key</th><th>English text</th><th>Missing in</th></tr></thead>
          <tbody id="review-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="actions">
      <button id="back-to-setup-btn" class="btn">Back</button>
      <button id="run-btn" class="btn btn-primary">Translate selected</button>
    </div>
  </section>

  <section id="screen-progress" class="screen"></section>
  <section id="screen-results" class="screen"></section>
</main>

<script src="../app/web/app.js"></script>
<script>
window.pywebview = { api: { poll_events: async () => [] } };

wireReviewScreen();

scanResult = {
  eng_count: 42,
  languages: { de: "German", fr: "French", ja: "Japanese" },
  variant_folders: ["values-land"],
  unrecognized_folders: [],
  parse_errors: [],
  invalid_lang_codes: [],
  keys: [
    { key: "login_button", text: "Log in", missing_in: ["de"], present_in: ["fr", "ja"] },
    { key: "login_forgot_password", text: "Forgot your password?", missing_in: ["de", "ja"], present_in: ["fr"] },
    { key: "signup_button", text: "Create account", missing_in: ["de", "fr", "ja"], present_in: [] },
    { key: "signup_terms_notice", text: "By signing up you agree to our Terms of Service", missing_in: ["ja"], present_in: ["de", "fr"] },
    { key: "logout_confirm_title", text: "Log out?", missing_in: ["de"], present_in: ["fr", "ja"] },
    { key: "logout_confirm_message", text: "You'll need to log in again to access your account", missing_in: ["de", "fr"], present_in: ["ja"] },
    { key: "cart_empty_message", text: "Your cart is empty", missing_in: ["ja"], present_in: ["de", "fr"] },
    { key: "cart_checkout_button", text: "Proceed to checkout", missing_in: ["de", "ja"], present_in: ["fr"] },
    { key: "error_network", text: "Network error, please try again", missing_in: ["de"], present_in: ["fr", "ja"] },
    { key: "error_login_invalid", text: "Incorrect email or password", missing_in: ["de", "fr"], present_in: ["ja"] },
  ],
};
renderReviewScreen();

document.getElementById("review-filter-input").value = "login";
applyReviewFilter();
</script>
</body>
</html>
